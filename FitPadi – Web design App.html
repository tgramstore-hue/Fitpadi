<style>
:root{--g:#16A34A;--gd:#15803D;--mint:#DCFCE7;--bg:#fff;--sf:#F3F6F4;--wh:#fff;--tx:#14261C;--sub:#5F7167;--ln:#E4EBE7;--nv:rgba(255,255,255,.92);--sh:0 12px 28px rgba(20,38,28,.14);--pur:#6D3AE8;--cor:#EF5A3C;--blu:#2563EB;--tea:#0F766E;--amb:#D97706;--ease:cubic-bezier(.32,.72,0,1);--f:"Outfit",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}

['walking-guide','How much walking is enough? A beginner’s guide','Walking','5 min read','#16A34A','act',[['Start where you are','If you are new to regular activity, the best first step is a realistic one. A ten-minute walk after a meal, three or four days a week, is a better start than an ambitious plan you abandon after a few days. Consistency matters more than speed or distance in the first month.'],['What the guidelines say','The World Health Organization suggests that healthy adults aim for at least 150 to 300 minutes of moderate-intensity activity each week, such as brisk walking. That works out to roughly 20 to 40 minutes a day. If that sounds like a lot, remember that it can be built up gradually and split into shorter sessions.'],['Step counts are a guide, not a rule','Many people use 5,000, 8,000 or 10,000 steps as daily targets. These numbers are useful for motivation, but there is no single perfect figure. Choose a target slightly above your current average and raise it every couple of weeks.'],['Make it stick','Walk with a friend, pick a route you enjoy, keep comfortable shoes by the door and track your progress. Stop and speak to a health professional if you feel chest pain, dizziness or unusual breathlessness, and check with your doctor before starting if you have a medical condition.']]],
['balanced-plate','Building a balanced plate with familiar Nigerian meals','Nutrition','6 min read','#EF5A3C','leaf',[['Think in portions, not rules','A balanced plate does not require giving up the foods you love. A simple approach is to fill about half your plate with vegetables or fruit, a quarter with a protein food and a quarter with a starchy staple such as rice, yam, beans or whole grains.'],['Using familiar foods','Many traditional dishes already contain useful ingredients. Vegetable soups add leafy greens, beans and fish provide protein, and plantain, yam and brown rice offer energy. Frying and heavy use of oil or salt can add up, so try grilling, steaming or using less oil where you can.'],['Do not forget drinks','Water is the simplest choice. Sugary drinks can add many calories without making you feel full, so consider them an occasional treat. Carrying a bottle can help you notice how much you drink.'],['A note on advice','This article is general education, not a diet plan. If you have diabetes, high blood pressure, are pregnant or have another health condition, ask a doctor or registered dietitian for advice that fits you.']]],
['breathing-break','A five-minute breathing break for stressful days','Mental wellness','4 min read','#0F766E','heart',[['Why slow breathing helps','When we feel stressed, our breathing often becomes quick and shallow. Slowing it down can help you feel calmer and more in control. It will not solve the cause of stress, but it can give you a moment to reset.'],['Try this simple exercise','Sit comfortably with your feet on the floor. Breathe in through your nose for a count of four, then breathe out gently for a count of four. Continue for five minutes. If your mind wanders, simply return your attention to the count.'],['Make it a habit','Pair the exercise with something you already do, such as the first few minutes after you wake or a break between tasks. Short, regular practice usually feels easier than occasional long sessions.'],['When to seek support','If stress, low mood or worry affects your daily life for more than a couple of weeks, talk to a health professional or someone you trust. If you are in crisis, contact your local emergency services.']]]];

about:()=>doc('About FitPadi',[['Our mission',['FitPadi exists to make healthy living feel achievable and rewarding. “Padi” is a friendly word for a friend, and that is the spirit of the product: a supportive companion that helps you build small, sustainable habits.']],['What we offer',['FitPadi combines daily missions, guided programmes, a walking tracker, breathing exercises, health education articles and community challenges. People earn points for genuine healthy activity and can take part in friendly competitions.','We are starting in Nigeria, with plans to support Ghana, Cameroon, South Africa and other markets.']],['How we create content',['Our articles and lessons are written in plain language and are designed to be educational. We aim to reflect widely accepted public health guidance, we avoid claims that anything prevents, diagnoses or cures disease, and we encourage readers to speak to qualified professionals about their own situation.']],['How we are funded',['FitPadi is free to use. We may display advertising, which is always labelled and kept separate from our own interface. We never place ads next to exercise controls, and we never reward anyone for viewing or clicking ads.']],['Get in touch',['Questions or feedback? Visit our <a href="#/contact">contact page</a> and we will be happy to help.']]]),

privacy:()=>doc('Privacy Policy',[['Last updated: 1 November 2026',['This Privacy Policy explains how FitPadi (“we”, “us”) collects, uses and protects personal information when you use our website and web application (the “Service”). By using the Service you acknowledge this policy.']],
['1. Information we collect',['• Account information: name, email address, country and password (stored in hashed form).','• Profile and wellbeing preferences: age range, fitness goals, preferred activities and any exercise limitations you choose to share. We treat this as sensitive and ask you to share only what you are comfortable with.','• Activity data: steps, workouts, lessons completed, challenge participation, points and referral activity.','• Technical data: IP address, device and browser type, pages viewed and approximate location derived from your IP address.','• Communications: messages you send us through the contact form or by email.']],
['2. How we use information',['• To provide, personalise and improve the Service.','• To operate points, challenges, referrals and reward features, and to detect fraud and abuse.','• To send service messages and, where permitted, reminders and updates you can opt out of.','• To measure performance and understand how the Service is used.','• To show advertising, as described below.','• To comply with legal obligations.']],
['3. Cookies and similar technologies',['We use essential cookies that are needed to run the Service, and, with your consent, analytics and advertising cookies. Our home page also embeds a video from YouTube from YouTube, which may set cookies or collect usage data when the video plays. You can change your choice at any time by clearing your browser storage, which will show the consent notice again, and you can also block cookies in your browser settings.']],
['4. Advertising and Google AdSense',['We may use Google AdSense and other third-party advertising vendors to display ads on the Service. Third-party vendors, including Google, use cookies to serve ads based on a user’s previous visits to this and other websites. Google’s use of advertising cookies enables it and its partners to serve ads based on your visit to our Service and/or other sites on the internet.','You may opt out of personalised advertising by visiting <a href="https://adssettings.google.com" rel="noopener">Google Ads Settings</a>. You can also opt out of some third-party vendors’ use of cookies by visiting <a href="https://www.aboutads.info" rel="noopener">www.aboutads.info</a>. Where required by law, such as in the European Economic Area and the United Kingdom, we request your consent before using cookies for personalised advertising.','Advertisements are clearly labelled. We do not reward users for viewing or clicking on ads.']],
['5. How we share information',['We do not sell your personal information. We share it only with service providers who help us operate the Service (such as hosting, analytics and payment or payout partners), with advertising partners as described above, when required by law, and in connection with a merger or sale of the business. Service providers are required to protect your information.']],
['6. Legal bases',['Where laws such as the Nigeria Data Protection Act 2023 or the GDPR apply, we rely on your consent, the need to perform our contract with you, our legitimate interests in running and securing the Service, and legal obligations.']],
['7. International transfers',['Your information may be processed in countries other than your own. Where we transfer it, we take steps to ensure it remains protected as required by applicable law.']],
['8. Retention',['We keep personal information only as long as needed for the purposes described, or as required by law. You can ask us to delete your account at any time.']],
['9. Security',['We use reasonable technical and organisational measures to protect information. No online service is completely secure, so please use a strong, unique password.']],
['10. Your rights',['Depending on where you live, you may have the right to access, correct, delete, restrict or object to the use of your information, to receive a portable copy, and to withdraw consent at any time. To exercise these rights, email privacy@fitpadi.com. You may also complain to your data protection regulator, such as the Nigeria Data Protection Commission.']],
['11. Children',['The Service is not intended for anyone under 18, and we do not knowingly collect information from children. If you believe a child has given us information, contact us and we will delete it.']],
['12. Third-party links',['The Service may link to other websites. We are not responsible for their privacy practices.']],
['13. Changes to this policy',['We may update this policy from time to time. We will post the new version here and change the date above. Significant changes will be highlighted.']],
['14. Contact us',['For privacy questions or requests, email privacy@fitpadi.com or use our <a href="#/contact">contact page</a>.']]]),
terms:()=>doc('Terms of Service',[['Last updated: 1 November 2026',['These Terms of Service (“Terms”) govern your use of the FitPadi website and web application (the “Service”). By creating an account or using the Service you agree to these Terms and our <a href="#/privacy">Privacy Policy</a>. If you do not agree, please do not use the Service.']],
['1. Eligibility and accounts',['You must be at least 18 years old to use the Service. You are responsible for keeping your login details secure and for activity on your account. Provide accurate information and tell us if you suspect unauthorised access.']],
['2. Health disclaimer',['FitPadi provides general wellness and educational information only. It is not medical advice and does not diagnose, treat, cure or prevent any condition. Consult a qualified health professional before starting any exercise, nutrition or wellness programme, especially if you have a medical condition, are pregnant or are older. Stop and seek help if you feel unwell. See also our <a href="#/disclaimer">Health &amp; Ad Disclaimer</a>.']],
['3. Points, challenges and rewards',['• Points are awarded for genuine health-related activity and have no cash value on their own.','• Rewards may be funded from the FitPadi Health Fund, which is a finite pool. When the pool has been fully distributed, rewards from it end. Fund figures are published on our Impact page.','• Cash rewards, where offered, depend on eligibility, account verification, minimum withdrawal amounts and payout methods available in your country.','• Payout methods may be unavailable in some regions and we may change, suspend or end any reward, challenge or feature at any time.','• We may withhold or reverse points or rewards obtained through cheating, automation, fake activity, duplicate accounts or other abuse.']],
['4. Referrals',['You may invite friends with your referral code. A referral becomes eligible for commission only when it meets the published qualification rules, such as completing a required number of active days. Self-referrals, fake accounts and misleading promotion are prohibited and may lead to forfeiture of commission and account closure.']],
['5. Acceptable use',['You agree not to misuse the Service, including by attempting to access it unlawfully, disrupting it, scraping it, uploading harmful or unlawful content, harassing others or impersonating anyone.']],
['6. Advertising',['The Service may display third-party advertising. Ads are labelled and are not endorsements by us. You must not click your own ads or encourage others to click ads. We do not provide rewards for viewing or clicking ads.']],
['7. Intellectual property',['The Service, including its text, design, graphics and software, is owned by FitPadi or its licensors and protected by law. You may use it for personal, non-commercial purposes. You may not copy, republish or sell our content without written permission.']],
['8. Third-party links and services',['The Service may link to or integrate third-party services. We are not responsible for their content or practices.']],
['9. Disclaimers and limitation of liability',['The Service is provided “as is” and “as available”. To the fullest extent permitted by law, we do not guarantee that it will be uninterrupted or error-free, and we are not liable for indirect or consequential losses or for injuries arising from your use of exercise or nutrition information. Nothing in these Terms limits liability that cannot be limited by law.']],
['10. Suspension and termination',['You may stop using the Service and delete your account at any time. We may suspend or terminate access if you breach these Terms or if required by law.']],
['11. Governing law',['These Terms are governed by the laws of the Federal Republic of Nigeria, and disputes will be handled by the courts of Nigeria, subject to any mandatory consumer rights you have in your country.']],
['12. Changes to these Terms',['We may update these Terms. If changes are material we will give notice through the Service. Continued use after the update means you accept the new Terms.']],
['13. Contact',['Questions about these Terms? Email support@fitpadi.com or visit our <a href="#/contact">contact page</a>.']]]),
disclaimer:()=>doc('Health & Ad Disclaimer',[['Health and fitness disclaimer',['The content on FitPadi, including programmes, articles, quizzes and estimates for calories or steps, is for general information and education only. It is not a substitute for professional medical advice, diagnosis or treatment. Always seek the advice of a qualified health provider with any questions about a medical condition, and never ignore professional advice because of something you read on FitPadi.','Calorie, distance and active-time figures are estimates and may differ from real values.']],['Emergency',['If you think you are having a medical emergency, contact your local emergency services immediately.']],['Advertising disclosure',['We may display advertising from third parties, including Google AdSense. Advertisements are labelled, are separate from our own content, and do not mean that we endorse the advertised product or service. We do not reward users for viewing or clicking ads. See our <a href="#/privacy">Privacy Policy</a> for details about cookies and personalised advertising.']],['Rewards',['Points have no cash value on their own. Cash rewards, where available, are subject to our <a href="#/terms">Terms of Service</a>, verification and regional availability.']]])};

function cm(e){if(e.dataset.d)return;e.dataset.d=1;const n=+e.dataset.m,t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/1500),v=n*(1-Math.pow(1-k,3));e.textContent=(e.dataset.p?'':'$')+Math.round(v).toLocaleString('en-US');if(k<1)requestAnimationFrame(s)})(t0)}

['Eating well with Nigerian meals','food','#EF5A3C','Build balanced plates with familiar foods.',[['The balanced plate','Aim to fill about half your plate with vegetables or fruit, a quarter with protein and a quarter with a starchy staple. Familiar meals can fit this pattern.','Think in portions, not rules.','How much of the plate can be vegetables or fruit?',['About half','None','A tiny pinch'],0],['Smart cooking at home','Grilling, steaming or baking can use less oil than deep frying. Season with herbs, pepper and onions instead of leaning on salt or stock cubes.','How you cook matters as much as what you cook.','Which method usually uses less oil?',['Steaming','Deep frying','Double frying'],0],['Drinks and hydration','Water is the simplest everyday drink. Sugary drinks add calories without filling you up, so treat them as an occasional choice.','Make water your default.','What is a good default drink?',['Water','Soda','Energy drink'],0]]],
['Stress and sleep basics','sleep','#0F766E','Simple routines for calmer days and better nights.',[['How stress affects the body','Stress can raise your heart rate and tighten your muscles. Short bursts are normal, but long periods without a break can leave you feeling worn out.','Rest is part of staying healthy.','Is short-term stress normal?',['Yes','Never','Only in children'],0],['A calming breathing routine','Breathe in through your nose for four counts, then out for four counts. Repeat for a few minutes to help you feel calmer.','Slow breathing is a simple reset.','How long is each phase in this routine?',['Four counts','One count','Twenty counts'],0],['Better sleep habits','Keep regular sleep and wake times, avoid screens close to bedtime and keep your room dark and cool where you can.','Consistency helps your body clock.','What helps sleep?',['A regular bedtime','Late caffeine','Bright screens in bed'],0]]]];

const BLOG=[
['habit-science','How to build a habit that lasts: the science of small steps','Healthy habits','6 min read','2026-11-01','#6D3AE8','mind','Why most new routines fade after a few weeks, and how tiny steps, cues and patience help healthy habits stick.',
['Habits usually take longer than 21 days to form','Attach a new habit to something you already do','Make the first step so small it feels easy'],
'Most of us have started a healthy routine with great energy and dropped it a few weeks later. That does not mean you lack willpower. It usually means the plan was too big, too vague or too dependent on motivation. Understanding how habits form can help you build routines that last.',
[['The 21-day myth','You may have read that a habit forms in 21 days. A widely cited 2009 study of people forming new everyday habits found that it took an average of about 66 days, with a very wide range from 18 to 254 days depending on the person and the behaviour. The practical lesson is to be patient and to expect the process to take weeks or months rather than days.'],['Cue, routine, reward','Habits are often described as a loop. A cue triggers a routine, and the routine leads to a reward. For example, finishing breakfast (cue) leads to a ten-minute walk (routine), which brings a feeling of energy and accomplishment (reward). Designing each part of the loop on purpose makes the behaviour more automatic over time.'],['Start tiny and stack','Make the first step so small that it is hard to say no: one minute of stretching, one glass of water, one flight of stairs. Then attach it to something you already do every day, such as brushing your teeth or making tea. Once the small step feels natural, increase it gradually.'],['Plan for slip-ups','Missing a day is normal and does not erase your progress. Decide in advance what you will do when life gets in the way, such as doing a shorter version the next day. Research on habit formation suggests that occasional misses do not stop a habit from forming, as long as you return to it.'],['Track and celebrate','Mark each day on a calendar or in an app and notice your small wins. Visible progress is motivating, and a moment of celebration, even just saying well done, helps your brain link the behaviour with a positive feeling.']],
[['Lally et al. (2009), How are habits formed: modelling habit formation in the real world','https://doi.org/10.1002/ejsp.674']]],
['food-labels','How to read food labels: serving size, sugar and salt explained','Nutrition','5 min read','2026-10-31','#D97706','food','A simple guide to reading packaged-food labels so you can compare products and choose with confidence.',
['Check the serving size before anything else','Compare products using the per 100 g column','Watch the sugar and salt, which can hide under other names'],
'Packaged foods are convenient, but labels can be confusing. A few simple habits can help you understand what is really in the product you are holding and compare it with alternatives.',
[['Start with the serving size','The numbers on a label usually apply to one serving, which may be smaller than the amount you actually eat. If a pack contains three servings and you eat it all, multiply the numbers by three. Checking this first prevents most surprises.'],['Understand sugar, salt and fat','The World Health Organization recommends that adults consume less than 5 grams of salt per day, and that free sugars make up less than 10 percent of total energy intake, with additional benefits below 5 percent. Many packaged snacks, drinks, sauces and seasoning cubes can contribute a large share of these limits in a single serving.'],['Read the ingredients list','Ingredients are listed in order of weight, from most to least. If sugar, syrup or oil appears near the top, the product contains a lot of it. Sugar has many names, including glucose syrup, fructose, maltose and honey, so look out for several sweeteners in the same list.'],['Compare per 100 g','When choosing between two similar products, such as two breakfast cereals or two tins of tomatoes, compare the per 100 g column rather than the per serving column. This puts both products on the same footing even when pack sizes differ.'],['Be careful with health claims','Words such as natural, light or low fat on the front of a pack do not guarantee that a product is healthy. A low-fat product can still be high in sugar. Always check the nutrition table and ingredients on the back.']],
[['WHO, Healthy diet fact sheet','https://www.who.int/news-room/fact-sheets/detail/healthy-diet'],['WHO, Salt reduction fact sheet','https://www.who.int/news-room/fact-sheets/detail/salt-reduction']]],
['older-adults-walking','Walking for older adults: a safe way to stay active and independent','Older adults','5 min read','2026-10-29','#0F766E','walk','Practical, low-risk ways for older adults to start walking, build strength and balance, and reduce the risk of falls.',
['Walking is gentle, free and easy to adjust','Balance and strength activities on three or more days a week help prevent falls','Check with a health professional if you have a medical condition'],
'Staying active becomes even more valuable as we age. Regular movement helps us stay mobile, keep our independence and feel better in ourselves. Walking is a good starting point for many older adults because it is gentle, free and easy to adjust to your own pace.',
[['Why walking helps','Regular walking supports heart health, helps keep muscles and joints moving, and can lift mood. Walking with a friend or neighbour also brings social contact, which matters for wellbeing. Even short walks add up over the week.'],['How to start safely','Begin with five to ten minutes on a flat, familiar route and add a little time each week. Walk in daylight, wear shoes with good grip and support, carry water and a phone, and use a walking stick if you have been advised to. If you feel chest pain, dizziness or unusual breathlessness, stop and seek medical advice.'],['Add balance and strength','The World Health Organization recommends that older adults include activities that emphasise balance and strength on three or more days a week to improve functional capacity and help prevent falls. Simple examples include standing up from a chair several times, standing on one leg while holding a counter, and heel-to-toe walking along a wall.'],['Reduce the risk of falls at home','Keep floors clear of loose rugs and cables, make sure stairs and bathrooms are well lit, and use non-slip mats. Regular eye checks and reviewing medicines with a pharmacist or doctor can also lower the risk of falls.'],['Make it a routine','Pick a regular time, such as after breakfast or in the cooler evening, and invite someone to join you. Keep a simple record of your walks so you can see your progress and celebrate it.']],
[['WHO, Physical activity fact sheet','https://www.who.int/news-room/fact-sheets/detail/physical-activity']]],
['work-stress','Managing stress at work: five practical techniques','Mental wellness','5 min read','2026-10-26','#6D3AE8','mind','Simple, realistic ways to cope with pressure at work, from micro-breaks and breathing to setting boundaries and asking for support.',
['Stress has physical and emotional signs worth noticing early','Short breaks and slow breathing help you reset','Talking to someone is a strength, not a weakness'],
'Workplace stress is common, whether you commute through heavy traffic, juggle several jobs or work long hours. You may not be able to remove every source of pressure, but small and regular habits can help you cope better and protect your wellbeing.',
[['Notice the signs','Persistent tiredness, irritability, trouble concentrating, headaches, muscle tension and disturbed sleep can all be signs of stress. Noticing them early gives you more options than waiting until you feel overwhelmed.'],['Take micro-breaks','Stand up and stretch at least once an hour, take a short walk at lunchtime and rest your eyes from screens. Even two minutes away from a task can help you return with a clearer head.'],['Use a breathing reset','Before a stressful meeting or after a difficult call, breathe in through your nose for a count of four and breathe out gently for a count of four. Repeat for two minutes. Slow breathing will not remove the problem, but it can help you feel calmer and more in control.'],['Set boundaries where you can','Finish tasks at set times when possible, switch off work notifications outside working hours and say no to extra work when you are at capacity. If your workload is consistently unmanageable, consider talking to your manager about priorities.'],['Talk to someone','Sharing your worries with a friend, family member, colleague or counsellor can lighten the load. If stress, low mood or worry is affecting your daily life for more than a couple of weeks, speak to a health professional. If you are in crisis, contact your local emergency services.']],
[['WHO, Stress questions and answers','https://www.who.int/news-room/questions-and-answers/item/stress']]],
['eating-on-budget','Healthy eating on a budget: practical tips using local foods','Nutrition','6 min read','2026-10-23','#EF5A3C','food','How to plan, shop and cook nutritious meals with affordable staples such as beans, eggs, seasonal vegetables and local fish.',
['Beans, eggs and local fish are affordable protein options','Seasonal produce is cheaper and fresher','Planning your meals reduces waste and impulse spending'],
'Eating well does not have to be expensive. With some planning, familiar staples and seasonal foods can make nutritious meals that fit a tight budget. Here are practical ideas you can start using this week.',
[['Plan before you shop','Write a simple meal plan for the week and a shopping list based on it. Check what you already have at home and buy only what you need. Avoid shopping when you are hungry, because it makes impulse purchases more likely.'],['Choose affordable protein','Beans, lentils, eggs, groundnuts and locally available fish usually provide protein at a lower cost than many other sources. Cooking beans in a large batch and storing portions can save both time and cooking fuel.'],['Buy seasonal vegetables and fruit','Produce is usually cheaper and fresher when it is in season. Leafy greens, tomatoes, peppers, oranges and pawpaw are good examples in many markets. Buy small amounts more often if you cannot keep food cool, so it stays fresh.'],['Cook smart and waste less','Cook once and use leftovers for another meal, stretch stews with extra vegetables and store cooked food safely. Using less oil and salt is both healthier and cheaper.'],['Be careful with cheap, ultra-processed snacks','Snacks and drinks that are high in sugar, salt and fat are often inexpensive but are not very filling and add little nutrition. Pair them with fruit, groundnuts or a boiled egg, or keep them as occasional treats.']],
[['WHO, Healthy diet fact sheet','https://www.who.int/news-room/fact-sheets/detail/healthy-diet']]],
['sleep-routine','Better sleep: how to build a bedtime routine that works','Sleep','5 min read','2026-10-19','#2563EB','sleep','Seven evidence-informed habits that make it easier to fall asleep, stay asleep and wake up feeling rested.',
['Most adults need at least seven hours of sleep','A consistent schedule matters more than any single trick','Speak to a doctor if sleep problems last for weeks'],
'Good sleep supports mood, concentration, energy and overall health, yet many adults struggle to get enough. The good news is that small changes to your evening routine can make a real difference.',
[['How much sleep do adults need?','Sleep experts generally recommend that adults get at least seven hours of sleep each night. Needs vary between people, so pay attention to how rested you feel during the day rather than focusing only on the number.'],['Keep a regular schedule','Going to bed and waking up at similar times, even on weekends, helps set your body clock. Getting outside in natural light in the morning also supports a healthy sleep pattern.'],['Create a wind-down routine','Dim the lights and put your phone away at least 30 minutes before bed. Try a calming activity such as gentle stretching, reading or slow breathing. A short, predictable routine signals to your body that it is time to rest.'],['Watch caffeine, meals and heat','Avoid caffeine in the late afternoon and evening, and avoid heavy meals close to bedtime. Keep your room as cool, dark and quiet as you can. In hot weather, a fan, light bedding and a cool shower before bed can help.'],['When to get help','If you regularly struggle to fall asleep, snore loudly, stop breathing during sleep or feel very sleepy during the day, speak to a doctor. These can be signs of a condition that deserves proper assessment.']],
[['CDC, About sleep','https://www.cdc.gov/sleep/about/index.html']]],
['home-strength','Strength training at home: a beginner’s guide with no equipment','Fitness','6 min read','2026-10-14','#16A34A','strength','Five simple bodyweight exercises, a safe warm-up and an easy weekly plan to build strength at home.',
['Adults are advised to do muscle-strengthening activity on two or more days a week','Bodyweight exercises need no equipment','Good form and gradual progress matter more than speed'],
'Strength training is not only for the gym. Simple bodyweight exercises at home can help you build muscle, protect your joints and make everyday tasks such as carrying shopping or climbing stairs easier.',
[['Why strength matters','Public health guidance recommends muscle-strengthening activities on two or more days a week for adults. Stronger muscles support posture, balance and bone health, and they help you stay independent as you get older.'],['Five moves to start with','Try squats to a chair, wall or knee push-ups, glute bridges, a plank on your knees or toes, and standing calf raises. Aim for two sets of eight to twelve repetitions of each, resting for about a minute between sets.'],['Warm up and keep it safe','Warm up for five minutes with marching on the spot and arm circles. Move slowly and breathe out as you make the effort. Stop if you feel sharp pain. If you have a joint, heart or other medical condition, ask a health professional which exercises are suitable.'],['Progress without equipment','When an exercise feels easy, add repetitions, slow the movement down or move to a harder variation, such as full push-ups. A backpack with books or a filled water container can add resistance.'],['Build a weekly routine','Two or three sessions of 20 to 30 minutes on non-consecutive days is plenty to begin with. Note your sessions and the number of repetitions so you can see your progress over the weeks.']],
[['WHO, Physical activity fact sheet','https://www.who.int/news-room/fact-sheets/detail/physical-activity']]],
['how-much-water','How much water do you really need each day?','Nutrition','4 min read','2026-10-09','#2563EB','water','The popular eight-glasses rule is a handy reminder, not a rule. Here is how to judge your own fluid needs.',
['There is no single number that fits everyone','Pale yellow urine is a simple guide','Follow medical advice if you have a kidney or heart condition'],
'You may have heard that everyone needs eight glasses of water a day. The truth is more flexible. How much fluid you need depends on your body, the weather, your diet and how active you are.',
[['Why there is no magic number','Fluid needs vary with body size, climate, activity level and diet. Fruit, vegetables, soups and other drinks all contribute to your intake. The eight-glass rule is a useful reminder rather than a scientific requirement.'],['Signs you may need more','Thirst, dark yellow urine, headaches, tiredness and a dry mouth can all be signs that you need more fluid. In hot weather, or after exercise, you will usually need more than usual.'],['Simple ways to drink more','Keep a bottle where you can see it, drink a glass with each meal, add a slice of lemon or cucumber for taste and set gentle reminders until drinking regularly becomes a habit.'],['Take care with other drinks','Sugary soft drinks and energy drinks add calories and sugar without making you feel full, so treat them as an occasional extra. People who have been advised to limit fluids, for example because of some kidney or heart conditions, should follow their doctor’s guidance.']],
[['NHS, Water, drinks and nutrition','https://www.nhs.uk/live-well/eat-well/food-guidelines-and-food-labels/water-drinks-nutrition/']]],
['blood-pressure-basics','Blood pressure basics: what the numbers mean and why they matter','Heart health','6 min read','2026-10-05','#2563EB','mind','A plain-language guide to blood pressure readings, healthy habits and when to speak to a doctor.',
['A reading has two numbers: systolic (top) and diastolic (bottom)','High blood pressure often has no symptoms, so measuring it matters','Healthy habits help, but always follow your clinician’s advice'],
'Blood pressure is one of the most common health checks, yet many people are unsure what the numbers mean. High blood pressure often causes no symptoms, which is why regular checks matter. This guide explains the basics in plain language.',
[['What the two numbers mean','A blood pressure reading has two numbers, written like 120/80 mmHg. The first number, systolic pressure, is the force in your arteries when your heart beats. The second, diastolic pressure, is the force between beats. Both are measured in millimetres of mercury.'],['What counts as high?','Guidelines differ slightly between countries, but many define hypertension as readings that stay at or above 140/90 mmHg on repeated measurements, and some use a lower threshold. A single high reading does not mean you have hypertension, because stress, caffeine, exercise and even talking can raise it temporarily. A health professional will usually look at several readings.'],['Habits that support healthy blood pressure','Regular physical activity, limiting salt and heavily processed foods, eating more vegetables and fruit, reducing alcohol, avoiding tobacco and maintaining a healthy weight are all linked with healthier blood pressure. Changes work best when they are gradual and sustainable.'],['Getting an accurate reading','Sit quietly for five minutes with your back supported and feet flat, rest your arm at heart level, avoid caffeine and smoking for 30 minutes beforehand and use a validated upper-arm monitor. Write down your readings and share them with your clinic.'],['When to seek care','Speak to a doctor if your readings are repeatedly high, if high blood pressure runs in your family or if you take medication and want to change anything. Seek urgent help for severe headache, chest pain, confusion or sudden weakness.']],
[['WHO, Hypertension fact sheet','https://www.who.int/news-room/fact-sheets/detail/hypertension']]],
['breathing-break','A five-minute breathing break for stressful days','Mental wellness','4 min read','2026-09-28','#0F766E','mind','A simple slow-breathing exercise you can do anywhere to feel calmer and more in control.',
['Slow breathing can help you feel calmer','Four counts in and four counts out is a good start','Seek support if stress affects your daily life for weeks'],
'When life gets busy, it is easy to forget that you are breathing quickly and shallowly. A short breathing break is a simple, free way to pause and reset during a stressful day.',
[['Why slow breathing helps','When we feel stressed, our breathing often becomes quick and shallow. Slowing it down can help you feel calmer and more in control. It will not solve the cause of stress, but it can give you a moment to reset.'],['Try this simple exercise','Sit comfortably with your feet on the floor. Breathe in through your nose for a count of four, then breathe out gently for a count of four. Continue for five minutes. If your mind wanders, simply return your attention to the count.'],['Make it a habit','Pair the exercise with something you already do, such as the first few minutes after you wake or a break between tasks. Short, regular practice usually feels easier than occasional long sessions.'],['When to seek support','If stress, low mood or worry affects your daily life for more than a couple of weeks, talk to a health professional or someone you trust. If you are in crisis, contact your local emergency services.']],
[['WHO, Stress questions and answers','https://www.who.int/news-room/questions-and-answers/item/stress']]],
['balanced-plate','Building a balanced plate with familiar Nigerian meals','Nutrition','6 min read','2026-09-21','#EF5A3C','food','A simple way to plan balanced meals without giving up the foods you love, using familiar ingredients and sensible portions.',
['Fill about half your plate with vegetables or fruit','Use familiar foods and healthier cooking methods','This is general education, not a personal diet plan'],
'Healthy eating does not mean giving up the foods you grew up with. It means paying attention to proportions and preparation. Here is a simple way to build balanced plates with familiar Nigerian meals.',
[['Think in portions, not rules','A balanced plate does not require giving up the foods you love. A simple approach is to fill about half your plate with vegetables or fruit, a quarter with a protein food and a quarter with a starchy staple such as rice, yam, beans or whole grains.'],['Using familiar foods','Many traditional dishes already contain useful ingredients. Vegetable soups add leafy greens, beans and fish provide protein, and plantain, yam and brown rice offer energy. Frying and heavy use of oil or salt can add up, so try grilling, steaming or using less oil where you can.'],['Do not forget drinks','Water is the simplest choice. Sugary drinks can add many calories without making you feel full, so consider them an occasional treat. Carrying a bottle can help you notice how much you drink.'],['A note on advice','This article is general education, not a diet plan. If you have diabetes, high blood pressure, are pregnant or have another health condition, ask a doctor or registered dietitian for advice that fits you.']],
[['WHO, Healthy diet fact sheet','https://www.who.int/news-room/fact-sheets/detail/healthy-diet']]],
['walking-guide','How much walking is enough? A beginner’s guide','Fitness','5 min read','2026-09-14','#16A34A','walk','What the guidelines say about walking, how to build up gradually and how to choose a step goal that suits you.',
['Healthy adults are advised to aim for 150 to 300 minutes of moderate activity a week','Start with short walks and build up gradually','Choose a step goal slightly above your current average'],
'Walking is one of the simplest ways to look after your heart, joints and mood, and it needs no gym or equipment. The question most beginners ask is how much is enough. This guide explains what public health guidance says and how to build up safely.',
[['Start where you are','If you are new to regular activity, the best first step is a realistic one. A ten-minute walk after a meal, three or four days a week, is a better start than an ambitious plan you abandon after a few days. Consistency matters more than speed or distance in the first month.'],['What the guidelines say','The World Health Organization suggests that healthy adults aim for at least 150 to 300 minutes of moderate-intensity activity each week, such as brisk walking. That works out to roughly 20 to 40 minutes a day. If that sounds like a lot, remember that it can be built up gradually and split into shorter sessions.'],['Step counts are a guide, not a rule','Many people use 5,000, 8,000 or 10,000 steps as daily targets. These numbers are useful for motivation, but there is no single perfect figure. Choose a target slightly above your current average and raise it every couple of weeks.'],['Make it stick','Walk with a friend, pick a route you enjoy, keep comfortable shoes by the door and track your progress. Stop and speak to a health professional if you feel chest pain, dizziness or unusual breathlessness, and check with your doctor before starting if you have a medical condition.']],
[['WHO, Physical activity fact sheet','https://www.who.int/news-room/fact-sheets/detail/physical-activity']]]
